<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Calvin Yang">
  <title>Calvin Yang</title>
  <!-- The brand mark: three skewed field lines, centred with room to spare so
       they stay crisp at 16px. The header logo (tools/build_pages.py) and
       apple-touch-icon.png use the same geometry. Colors are --bg and
       --accent from css/site.css, with the dark theme's pair for dark UIs. -->
  <style>
    .ground { fill: #f1f0ea; }
    .lines { fill: #e4531b; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0b0c0b; }
      .lines { fill: #ff6a2b; }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="4"/>
  <g class="lines">
    <polygon points="7,11 11,9.22 11,27.22 7,29"/>
    <polygon points="14,7.89 18,6.11 18,24.11 14,25.89"/>
    <polygon points="21,4.77 25,3 25,21 21,22.77"/>
  </g>
</svg>
